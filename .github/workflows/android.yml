name: Oskol DEV34 validated builds
on:
  push:
    branches: [arena/ce299f3a-repo]
    paths: ['web/**', 'src/**', 'scripts/**', 'desktop/**', 'android/**', '.github/workflows/android.yml', 'package*.json', 'tests/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oskol-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Procedural tests + browser/GLSL smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:release && npm run build
      - run: npm run test:release:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Oskol-DEV34-validation
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .artifacts/dev34/smoke-results.json
            .artifacts/dev34/*.png
  android:
    name: Android APK · after tested Windows build
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts && npm run build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Compile APK with persistent Gradle cache
        working-directory: android
        run: gradle --no-daemon --build-cache :app:assembleDebug
      - name: Package
        run: |
          mkdir -p .artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk .artifacts/oskol-0.34.0-dev34-android.apk
          cd .artifacts && sha256sum *.apk > Android-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Oskol-Android-dev34-VALIDATED
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/oskol-*.apk
            .artifacts/Android-SHA256.txt
  windows:
    name: Windows x64 EXE · after validation
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-
      - run: npm ci
      - run: npm run build:windows
      - name: Run the actual portable EXE in isolated smoke mode
        run: node scripts/check-desktop-package.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Oskol-DEV34-desktop-smoke
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .artifacts/desktop-smoke.json
            .artifacts/desktop-smoke.log
      - name: Instructions and checksums
        run: |
          cp desktop/README.txt release-build/START-HERE.txt
          cd release-build && sha256sum *.exe > Windows-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Oskol-Windows-x64-dev34-VALIDATED
          if-no-files-found: error
          path: |
            release-build/*.exe
            release-build/START-HERE.txt
            release-build/Windows-SHA256.txt
  release:
    name: Publish standalone APK + EXE (no ZIP)
    needs: [android, windows]
    if: github.ref == 'refs/heads/arena/ce299f3a-repo'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Actions artifacts are internal transport. Users download Release assets,
      # which retain their actual .apk/.exe filenames and need no unpacking.
      - uses: actions/download-artifact@v4
        with:
          pattern: Oskol-*-VALIDATED
          path: .artifacts/release
          merge-multiple: true
      - name: Publish compiled binaries and SHA-256 only
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
