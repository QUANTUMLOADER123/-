name: Oskol dev10 builds (no tests)
on:
  push:
    branches: [arena/ce299f3a-repo]
    paths: ['web/**', 'src/**', 'scripts/**', 'desktop/**', 'android/**', '.github/workflows/android.yml', 'package*.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oskol-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android APK · build only
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts && npm run build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Compile APK only (tests intentionally not run)
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Package
        run: |
          mkdir -p .artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk .artifacts/oskol-0.11.0-dev10-android.apk
          cd .artifacts && sha256sum *.apk > Android-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Oskol-Android-dev10-NO-TESTS
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/oskol-*.apk
            .artifacts/Android-SHA256.txt
  windows:
    name: Windows x64 · build only
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build
      - run: npm run build:windows
      - name: Instructions and checksums
        run: |
          cp desktop/README.txt release-build/START-HERE.txt
          cd release-build && sha256sum *.exe > Windows-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Oskol-Windows-x64-dev10-NO-TESTS
          if-no-files-found: error
          path: |
            release-build/*.exe
            release-build/START-HERE.txt
            release-build/Windows-SHA256.txt
