name: Android APK
on:
  push:
    branches: [arena/ce299f3a-repo]
    paths: ['web/**', 'android/**', '.github/workflows/android.yml', 'tests/**', 'package*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm test
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Build installable prototype
        working-directory: android
        run: |
          mkdir -p ../.artifacts
          set +e
          gradle --no-daemon :app:assembleDebug :app:lintDebug 2>&1 | tee ../.artifacts/android-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt >> ../.artifacts/android-build.log 2>/dev/null || true
            python3 -c 'from pathlib import Path; s=Path("../.artifacts/android-build.log").read_text()[-18000:]; print("::error::" + s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$result"
      - name: Package APK
        run: |
          mkdir -p .artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk .artifacts/one-more-layer-0.1.0-android.apk
          cd .artifacts && sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: one-more-layer-android
          path: .artifacts/
      - name: Publish downloadable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "prototype-${GITHUB_RUN_NUMBER}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "ЕЩЁ СЛОЙ · Android 0.1.0 · build ${GITHUB_RUN_NUMBER}" \
            --notes "Playable offline prototype. Android 8.0+. Debug-signed APK for sideloading, not a Play Store release. No ads, accounts or internet permission. Local records. Signatures may differ between CI machines; uninstall an older prototype before installing if Android reports a signature conflict (local records will be lost)." \
            .artifacts/one-more-layer-0.1.0-android.apk .artifacts/SHA256SUMS.txt
