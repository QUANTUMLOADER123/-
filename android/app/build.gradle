plugins { id 'com.android.application' }
android {
    namespace 'game.oneslice'
    compileSdk 35
    defaultConfig {
        applicationId 'game.oskol.survival'
        minSdk 26
        targetSdk 35
        versionCode 32
        versionName '0.30.1-dev30'
        testInstrumentationRunner 'game.oneslice.SmokeInstrumentation'
    }
    // Intentionally PUBLIC development key; keeps test APK updates compatible. Never use for a production app.
    signingConfigs { debug { storeFile file('../dev-signing/oskol-dev.p12'); storeType 'PKCS12'; storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    sourceSets { main { assets.srcDirs = ['../../web'] } }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
